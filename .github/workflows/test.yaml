name: Test

on:
  # This workflow is triggered on pull requests to the main branch.
  pull_request:
    # milestoned is added here so that a PR can be re-triggered if it is milestoned.
    types: [milestoned, opened, reopened, synchronize]
    paths-ignore:
      - ".github/container-and-chart/**"

permissions: {}

# Abort prior jobs in the same workflow / PR
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
      packages: read
      pull-requests: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        type: [install, upgrade]
        flavor: [upstream, unicorn]
    uses: defenseunicorns/uds-common/.github/workflows/callable-test.yaml@7a86081440df7e1f4df1f4a6f9286642f9fd4d10 # v1.34.0
    with:
      timeout: 30
      options: --set BASE_REPO="ghcr.io/uds-packages"
      runsOn: appstore-4-core-amd64
      upgrade-flavors: upstream,unicorn
      flavor: ${{ matrix.flavor }}
      type: ${{ matrix.type }}
    secrets: inherit # Inherits all secrets from the parent workflow.

  verify-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    if: always()
    steps:
      - name: Check validate result
        run: |
          echo "validate result: ${{ needs.validate.result }}"

          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "One or more tests failed."
            exit 1
          fi

          echo "All tests passed successfully!"
