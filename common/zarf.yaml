# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/refs/heads/main/src/pkg/schema/zarf-v1beta1-component-schema.json
apiVersion: zarf.dev/v1beta1
kind: ZarfComponentConfig
metadata:
  name: reference-package
  description: UDS Reference Package common charts
component:
  charts:
    - name: uds-reference-package-config
      local:
        path: ../chart
      namespace: reference-package
      values:
        - sourcePath: .
          targetPath: .
    - name: reference-package
      oci:
        url: oci://ghcr.io/uds-packages/reference-package/helm/reference-package
        ref:
          tag: 0.3.0
      namespace: reference-package
      values:
        - sourcePath: .
          targetPath: .
